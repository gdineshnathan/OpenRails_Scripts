<!-- result -->
<rect x="91" y="749" width="1618" height="137" rx="18" fill="#12365c"/>
<text x="125" y="799" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="bold">Required behaviour:</text>
<text x="125" y="837" fill="#f2f7fd" font-family="Arial,Helvetica,sans-serif" font-size="25">Station 1 Starter must stay RED until the entire AI train clears Station 2 Starter.</text>
<text x="125" y="869" fill="#a9cbe9" font-family="Arial,Helvetica,sans-serif" font-size="21">Then permit PROCEED only if the ordinary route and safety conditions also allow it.</text>
